<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Creature — MDDN242</title>
    <link rel="icon" id="favicon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='32' font-size='32'>👾</text></svg>">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

    <!-- ════════════════════ CANVAS ════════════════════ -->
    <div class="canvas-area">
        <div id="canvas-container"></div>
    </div>

    <!-- ════════════════════ RPG PANEL ════════════════════ -->
    <div class="sidebar rpg-panel">

        <!-- Crown toggle — always visible -->
        <button class="crown-toggle" id="crown-toggle" onclick="toggleSidebar()" title="Toggle panel">
            <img src="image/crown.png" alt="☰">
        </button>

        <!-- Collapsible content -->
        <div id="sidebar-main">

        <!-- ── Top bar: level · name · clock ── -->
        <div class="rpg-topbar">
            <div class="rpg-lv-tag">LV<span id="ui-rpg-lv">1</span></div>
            <input type="text" id="rpg-name" class="rpg-name-input" maxlength="12"
                   placeholder="FAMILIAR"
                   oninput="window._setRpgName && window._setRpgName(this.value)">
            <div class="rpg-clock">
                <span id="ui-hour">--</span>:<span id="ui-min">--</span><span class="rpg-ampm" id="ui-period">am</span>
            </div>
        </div>

        <!-- ── Weather strip ── -->
        <div class="rpg-weather" id="rpg-weather" style="display:none">
            <span id="weather-icon">☀️</span>
            <span id="weather-temp">--°</span>
            <span id="weather-desc" class="weather-desc">--</span>
            <span id="weather-city" class="weather-city"></span>
        </div>

        <!-- ── HP hearts + XP bar ── -->
        <div class="rpg-vitals">
            <div class="rpg-hearts" id="rpg-hearts-row">♥♥♥♥♡</div>
            <div class="rpg-xp-wrap">
                <div class="rpg-xp-track">
                    <div class="rpg-xp-fill" id="ui-rpg-xp-fill" style="width:0%"></div>
                </div>
                <span class="rpg-xp-label">XP <span id="ui-rpg-xp">0</span>/20</span>
            </div>
        </div>

        <!-- ── Equipment grid ── -->
        <div class="equip-area">

            <!-- LEFT: decorations -->
            <div class="equip-col">
                <div class="equip-slot deco-btn" data-deco="hat"
                     onclick="window._toggleDeco && window._toggleDeco('hat')" title="Hat">
                    <div class="equip-icon" id="deco-icon-hat">—</div>
                    <div class="equip-lbl" id="deco-lbl-hat">Empty</div>
                </div>
                <div class="equip-slot deco-btn" data-deco="crown"
                     onclick="window._toggleDeco && window._toggleDeco('crown')" title="Crown">
                    <div class="equip-icon" id="deco-icon-crown">—</div>
                    <div class="equip-lbl" id="deco-lbl-crown">Empty</div>
                </div>
                <div class="equip-slot deco-btn" data-deco="bowtie"
                     onclick="window._toggleDeco && window._toggleDeco('bowtie')" title="Bow">
                    <div class="equip-icon" id="deco-icon-bowtie">—</div>
                    <div class="equip-lbl" id="deco-lbl-bowtie">Empty</div>
                </div>
                <div class="equip-slot deco-btn" data-deco="blush"
                     onclick="window._toggleDeco && window._toggleDeco('blush')" title="Blush">
                    <div class="equip-icon" id="deco-icon-blush">—</div>
                    <div class="equip-lbl" id="deco-lbl-blush">Empty</div>
                </div>
                <div class="equip-slot deco-btn" data-deco="sparkles"
                     onclick="window._toggleDeco && window._toggleDeco('sparkles')" title="Sparkles">
                    <div class="equip-icon" id="deco-icon-sparkles">—</div>
                    <div class="equip-lbl" id="deco-lbl-sparkles">Empty</div>
                </div>
            </div>

            <!-- CENTER: character portrait -->
            <div class="char-col">
                <div class="char-portrait">
                    <img src="image/human.png" class="char-img" alt=""
                         onerror="this.style.display='none'">
                    <!-- eyes -->
                    <div class="portrait-eye portrait-eye-l" id="portrait-eye-l">
                        <div class="portrait-pupil" id="portrait-pupil-l"></div>
                    </div>
                    <div class="portrait-eye portrait-eye-r" id="portrait-eye-r">
                        <div class="portrait-pupil" id="portrait-pupil-r"></div>
                    </div>
                    <div class="char-state-badge" id="ui-state">neutral</div>
                </div>
                <!-- need bar below portrait -->
                <div class="need-track" style="margin-top:6px">
                    <div class="need-fill" id="ui-need-bar" style="width:50%"></div>
                </div>
                <div class="char-need-label">
                    need <span id="ui-need-val">50</span>
                </div>
                <div class="char-stats">
                    <div class="stat-row">
                        <span class="stat-lbl">HP</span>
                        <span class="stat-val" id="stat-hp">—</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-lbl">MP</span>
                        <span class="stat-val" id="stat-mp">—</span><span class="stat-bonus" id="stat-mp-bonus"></span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-lbl">ATK</span>
                        <span class="stat-val" id="stat-atk">—</span><span class="stat-bonus" id="stat-atk-bonus"></span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-lbl">SPD</span>
                        <span class="stat-val" id="stat-spd">—</span><span class="stat-bonus" id="stat-spd-bonus"></span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-lbl">DEF</span>
                        <span class="stat-val" id="stat-def">—</span><span class="stat-bonus" id="stat-def-bonus"></span>
                    </div>
                </div>

                <!-- Skill icons -->
                <div class="char-skills">
                    <div class="char-skill-slot" id="skill-slot-water" title="Water Magic (Lv5)">
                        <img src="image/water_magic.png" class="skill-img" alt="">
                        <div class="skill-lock-overlay" id="skill-lock-water">Lv5</div>
                        <div class="skill-cd-overlay" id="skill-cd-water"></div>
                    </div>
                    <div class="char-skill-slot" id="skill-slot-fire" title="Fire Magic (Lv10)">
                        <img src="image/fair_magic.png" class="skill-img" alt="">
                        <div class="skill-lock-overlay" id="skill-lock-fire">Lv10</div>
                        <div class="skill-cd-overlay" id="skill-cd-fire"></div>
                    </div>
                </div>
            </div>

            <!-- RIGHT: weapons + actions -->
            <div class="equip-col">
                <div class="equip-slot weapon-slot" id="equip-wpn-0"
                     onclick="window._randomWeapon && window._randomWeapon()" title="Main Hand">
                    <div class="equip-icon" id="ws-icon-0">—</div>
                    <div class="equip-lbl" id="ws-label-0">Empty</div>
                </div>
                <div class="equip-slot weapon-slot" id="equip-wpn-1"
                     onclick="window._randomWeapon && window._randomWeapon()" title="Off Hand">
                    <div class="equip-icon" id="ws-icon-1">—</div>
                    <div class="equip-lbl" id="ws-label-1">Empty</div>
                </div>
                <div class="equip-slot action-slot"
                     onclick="window._randomWeapon && window._randomWeapon()" title="Roll weapons">
                    <div class="equip-icon">🎲</div>
                    <div class="equip-lbl">Roll</div>
                </div>
                <div class="equip-slot action-slot" id="battle-btn"
                     onclick="window._toggleBattle && window._toggleBattle()" title="Toggle battle">
                    <div class="equip-icon">⚔</div>
                    <div class="equip-lbl" id="battle-lbl">Battle</div>
                </div>
                <div class="equip-slot action-slot"
                     onclick="window._randomCostume && window._randomCostume()" title="Random costume">
                    <div class="equip-icon">🎭</div>
                    <div class="equip-lbl">Dress</div>
                </div>
            </div>
        </div>

        <!-- ── Collectibles ── -->
        <div class="collect-bar">
            <button class="collect-toggle-btn" onclick="window._openCollect && window._openCollect()">
                <span>Collectibles</span>
                <span id="collect-counter" class="collect-count">0/15</span>
            </button>
        </div>
        <div id="collect-panel" class="collect-panel">
            <div id="collect-grid" class="collect-grid"></div>
        </div>

        <!-- ── Settings (collapsible, includes actions + sliders) ── -->
        <details class="rpg-details">
            <summary class="rpg-details-title">⚙ Settings</summary>
            <div class="rpg-settings-body">
                <div class="rpg-actions">
                    <button class="rpg-btn" onclick="window._feedCreature && window._feedCreature()">
                        🍶 Feed
                    </button>
                    <button class="rpg-btn secondary" onclick="window._clearPaint && window._clearPaint()">
                        🧹 Clear
                    </button>
                    <button class="rpg-btn secondary" onclick="window._resetNeed && window._resetNeed()">
                        ❤ Heal
                    </button>
                </div>
                <div class="rpg-setting-row">
                    <label>Reset LV</label>
                    <button class="rpg-btn secondary" style="flex:1;padding:4px 8px;font-size:10px"
                        onclick="window._resetLevel && window._resetLevel()">⚠ Reset Level</button>
                </div>
                <div class="rpg-setting-row">
                    <label>Need decay</label>
                    <input type="range" min="0.001" max="0.045" step="0.001" value="0.003"
                        oninput="window._setDecay && window._setDecay(+this.value)">
                </div>
                <div class="rpg-setting-row">
                    <label>Feed amount</label>
                    <input type="range" min="5" max="50" step="5" value="20"
                        oninput="window._setFeed && window._setFeed(+this.value)">
                </div>
            </div>
        </details>

        </div><!-- end #sidebar-main -->
    </div><!-- end .sidebar -->

</div><!-- end .container -->

<script src="sketch.js"></script>
<script>
    function toggleSidebar() {
        const main    = document.getElementById('sidebar-main');
        const btn     = document.getElementById('crown-toggle');
        const sidebar = document.querySelector('.sidebar');
        const hidden  = main.classList.toggle('sidebar-main-hidden');
        btn.classList.toggle('collapsed', hidden);
        sidebar.classList.toggle('sidebar-collapsed', hidden);
    }
</script>
</body>
</html>
